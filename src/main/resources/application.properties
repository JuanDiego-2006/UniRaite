# ==========================================
# 1. CONEXIÓN A TU BASE DE DATOS EN AWS EC2
# ==========================================
# Reemplaza '100.55.238.48' por la IP PÚBLICA de tu instancia de AWS EC2 si es que cambió
spring.datasource.url=jdbc:mysql://100.55.238.48:3306/uniraite_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=diego
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. CONFIGURACIÓN JPA (MANTENEMOS TU LÓGICA)
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Usamos 'update' para que respete tus datos actuales y solo cree tablas si faltan
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 3. CONFIGURACIÓN PARA RAILWAY / NUBE
# ==========================================
# Railway necesita este puerto dinámico para exponer tu API
server.port=${PORT:8080}

# Mantenemos tus límites para las fotos en Base64
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB

# Configuración Firebase
app.firebase-config=classpath:firebase-service-account.json